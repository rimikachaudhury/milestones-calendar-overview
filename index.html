<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <script src="https://kit.fontawesome.com/e72cb60ca7.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>

    <div class="jumbotron bg-dark text-white">

      <div class="row">
        <!-- First column with icon and title -->
        <div class="col-1 d-flex align-items-center justify-content-center text-align-center">
            <img src="./public/images/flagwhite.svg" alt="Milestones" style="width: 50px; height: 50px;">
        </div>
        <!-- Second column with title, subtitle, and info icon -->
        <div class="col-9">
            <h1 class="display-4">Time Pulse</h1>
            <p class="lead">Review your time spent and handpicked  <i class="fa-solid fa-tag">
            </i> <i class="fa-solid fa-star"></i> resources to plan your study sessions. <a href="#" class="text-primary"><i class="fas fa-info-circle"></i></a></p>
            
        </div>
        <!-- Third column with input field -->
        <div class="col-12 col-md-2 order-3 order-md-2 d-flex align-items-end justify-content-center text-align-center">
          <div class="input-group mb-2 ">
            <div class="input-group-prepend">
              <span class="input-group-text" id="basic-addon1">@</span>
            </div>
            <input type="text" class="form-control" id="userInput" placeholder="username">
            <button id="submit" type="submit" class="btn btn-primary" onclick="submitUserInput()">Go</button>

          </div>

        </div>
    </div>

  </div>
        
  
    <div id="app">
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="//cdn.jsdelivr.net/npm/faunadb@latest/dist/faunadb.js"></script>
    <script type="text/javascript">
      var faunadb = window.faunadb
      var q = faunadb.query
      var client = new faunadb.Client({
        secret: 'fnAFLgiyHqAARM3hOMlaMuvqhwwlaMIOVcKU66Os',
        endpoint: 'https://db.us.fauna.com:443'
      })
      client.query(q.ToDate('2018-06-06')) // => 2018-06-06T00:00:00Z
      .then((ret) => console.log(ret))
      .catch((err) => console.error('Error: %s', err))

    </script>

  </body>
</html>
